# TechConnect Bénin — reverse proxy Nginx vers gunicorn (127.0.0.1:8000)
# Port 8083 : libre (8080 occupé par un autre service local).
# HTTPS terminé en amont par ngrok (gratuit). Pour un domaine + Let's Encrypt
# plus tard : ajouter listen 443 ssl + certbot, et retirer la couche ngrok.
server {
    listen 8083;
    server_name kam-nonsoluble-egoistically.ngrok-free.dev localhost 127.0.0.1;

    # Auth uploads (avatar ≤5 Mo, pièces jointes litige ≤5 Mo)
    client_max_body_size 6M;

    # Toutes les URLs (dont /static/ via WhiteNoise et /media/ en dev)
    # sont servies par Gunicorn — aucun accès au /home de l'utilisateur requis.
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
# TechConnect Bénin — reverse proxy Nginx vers gunicorn (127.0.0.1:8000)
# Port 8080 : libre (le 80 est occupé par le site driveby / IT-Asset-Manager).
# HTTPS terminé en amont par ngrok (gratuit). Pour un domaine + Let's Encrypt
# plus tard : ajouter listen 443 ssl + certbot, et retirer la couche ngrok.
server {
    listen 8080;
    server_name kam-nonsoluble-egoistically.ngrok-free.dev localhost 127.0.0.1;

    # Auth uploads (avatar ≤5 Mo, pièces jointes litige ≤5 Mo)
    client_max_body_size 6M;

    # Fichiers statiques collectés (collectstatic)
    location /static/ {
        alias /home/aspickiller/Documents/TechConnect_Benin/staticfiles/;
    }

    # Uploads utilisateurs (avatars, portfolio, pièces jointes)
    location /media/ {
        alias /home/aspickiller/Documents/TechConnect_Benin/media/;
    }

    # Application Django (gunicorn)
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
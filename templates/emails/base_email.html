{% load static %}<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ sujet }} — TechConnect Bénin</title>
</head>
<body style="margin:0; padding:0; background:#f3f4fb; font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f3f4fb; padding:24px 0;">
        <tr>
            <td align="center">
                <table role="presentation" width="600" cellpadding="0" cellspacing="0" style="max-width:600px; width:100%;">
                    <tr>
                        <td align="center" style="padding-bottom:18px;">
                            <span style="font-size:22px; font-weight:700; color:#312e81;">⚡ TechConnect <span style="color:#f59e0b;">Bénin</span></span>
                        </td>
                    </tr>
                    <tr>
                        <td style="background:#ffffff; border-radius:14px; padding:28px 32px; border:1px solid #e5e7eb;">
                            <h1 style="margin:0 0 14px; font-size:20px; color:#312e81;">{{ sujet }}</h1>
                            <div style="font-size:15px; line-height:1.6; color:#374151;">{{ contenu }}</div>
                            {% if bouton and lien %}
                                <div style="margin-top:24px; text-align:center;">
                                    <a href="{{ lien }}" style="display:inline-block; background:#6366f1; color:#ffffff; text-decoration:none; font-weight:600; font-size:15px; padding:12px 28px; border-radius:10px;">{{ bouton }}</a>
                                </div>
                            {% endif %}
                        </td>
                    </tr>
                    <tr>
                        <td align="center" style="padding-top:18px; font-size:12px; color:#9ca3af;">
                            © 2026 TechConnect Bénin — La mise en relation des services informatiques au Bénin.
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>

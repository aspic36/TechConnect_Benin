{% extends 'base.html' %}
{% block title %}Évaluer — TechConnect Bénin{% endblock %}
{% block content %}
<div class="hero-mini">
    <h2>⭐ Évaluer {{ cible.username }}</h2>
    <p>Mission : {{ mission.demande.titre }}</p>
</div>
<div class="card form-card">
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <div class="form-actions">
            <button class="btn btn-accent btn-lg" type="submit" style="width: 100%;">Envoyer l'évaluation</button>
        </div>
    </form>
</div>
<p class="card-meta"><a href="{% url 'propositions:detail_mission' mission.pk %}">← Retour à la mission</a></p>
{% endblock %}

{% extends 'base.html' %}
{% block title %}Soumettre une proposition — TechConnect Bénin{% endblock %}
{% block content %}
<div class="hero-mini">
    <h2>📬 Proposition pour : {{ demande.titre }}</h2>
    <p>{{ demande.description|truncatewords:40 }}</p>
</div>
<div class="card form-card" style="max-width: 620px;">
    <h3 class="card-title">Votre offre</h3>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <div class="form-actions">
            <button class="btn btn-accent btn-lg" type="submit" style="width: 100%;">Envoyer ma proposition</button>
        </div>
    </form>
</div>
{% endblock %}

{% extends 'base.html' %}
{% block title %}Connexion — TechConnect Bénin{% endblock %}
{% block content %}
<div class="hero-mini">
    <h2>Bon retour !</h2>
    <p>Connecte-toi pour retrouver tes demandes, propositions et missions.</p>
</div>
<div class="card form-card">
    <h3 class="card-title">Se connecter</h3>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <div class="form-actions">
            <button class="btn btn-lg" type="submit" style="width: 100%;">Se connecter</button>
        </div>
    </form>
    <p class="form-note">Pas de compte ? <a href="{% url 'accounts:inscription' %}">S'inscrire</a></p>
</div>
{% endblock %}

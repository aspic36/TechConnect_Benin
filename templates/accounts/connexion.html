{% extends 'base.html' %}
{% block title %}Connexion — TechConnect Bénin{% endblock %}
{% block content %}
<div class="card" style="max-width: 440px; margin: 0 auto;">
    <h2>Connexion</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <div class="form-actions">
            <button class="btn" type="submit">Se connecter</button>
        </div>
    </form>
    <p class="card-meta" style="margin-top: 1rem;">Pas de compte ?
        <a href="{% url 'accounts:inscription' %}">S'inscrire</a>
    </p>
</div>
{% endblock %}
